name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Scan repository candidates for credentials
        run: npx tsx scripts/scan-secrets.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete quality gate
        run: npm run check

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            app/output/playwright/test-results
            app/output/playwright/report
          if-no-files-found: ignore
          retention-days: 7
